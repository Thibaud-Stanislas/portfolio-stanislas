<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10110f"><title>Créer votre accès — Administration · Stanislas</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"><script src="../config.js"></script><script src="create-account.js" defer></script></head>
<body class="admin-login-page"><a class="login-wordmark" href="../index.html">stanislas<span>.</span></a><main class="login-shell"><section class="login-card"><div class="login-symbol">⌘</div><p class="admin-eyebrow">PREMIÈRE CONNEXION</p><h1>Créer votre accès.</h1><p class="login-intro">Cette étape ne peut être effectuée qu’une seule fois. Le code de création protège la création du compte propriétaire.</p><form id="setup-form"><label for="email">Votre adresse e-mail</label><input id="email" type="email" autocomplete="username" placeholder="vous@exemple.fr" required><label for="setup-token" style="margin-top:14px">Code de création fourni lors de la mise en service</label><input id="setup-token" type="password" autocomplete="off" placeholder="Code à usage unique" required><label for="password" style="margin-top:14px">Choisissez un mot de passe (14 caractères minimum)</label><input id="password" type="password" minlength="14" maxlength="256" autocomplete="new-password" placeholder="Votre mot de passe" required><label for="password-confirm" style="margin-top:14px">Confirmez le mot de passe</label><input id="password-confirm" type="password" minlength="14" maxlength="256" autocomplete="new-password" placeholder="Répétez votre mot de passe" required><button class="admin-primary" type="submit">Créer mon compte administrateur <span>↗</span></button><p id="setup-status" class="login-status" role="status" aria-live="polite"></p></form><a class="back-to-site" href="login.html">← Retour à la connexion</a></section><p class="login-footnote">STANISLAS · ADMINISTRATION</p></main></body>
</html>
