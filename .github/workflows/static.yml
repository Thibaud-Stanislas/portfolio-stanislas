name: Publier le portfolio sur GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers publics
        run: |
          mkdir -p site/admin site/projects/tempo site/projects/atelier-oree site/projects/escale
          cp index.html styles.css app.js config.js favicon.svg .nojekyll site/
          cp admin/login.html admin/index.html admin/admin.css admin/login.js admin/admin.js site/admin/
          cp projects/tempo/index.html projects/tempo/tempo.css projects/tempo/tempo-redesign.css projects/tempo/tempo.js site/projects/tempo/
          cp -R projects/tempo/images site/projects/tempo/
          cp projects/atelier-oree/index.html projects/atelier-oree/oree.css projects/atelier-oree/oree.js site/projects/atelier-oree/
          cp -R projects/atelier-oree/images site/projects/atelier-oree/
          cp projects/escale/index.html projects/escale/escale.css projects/escale/escale.js site/projects/escale/
          cp -R projects/escale/images site/projects/escale/
      - name: Déposer l’artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4


